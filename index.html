<!DOCTYPE html>

<!-- Inspiration:
https://www.w3schools.com/js/js_events_keyboard.asp
https://www.geeksforgeeks.org/javascript/javascript-date-now-method/
https://www.geeksforgeeks.org/javascript/javascript-blob/ -->


<html lang="da">
<head>
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Keypress logger</title>

  <style>
        body { font-family: sans-serif; margin: 20px; }
        #target {
            font-family: monospace;
            font-size: 20px;
            line-height: 1.8;
            white-space: pre-wrap;
            background: #2f2f2f;
            color: #888;
            padding: 16px;
            border-radius: 6px;
            max-width: 700px;
            margin-bottom: 12px;
        }
        .ok  { color: #ddd; }
        .bad { color: #ff6b6b; text-decoration: underline; }
        .cur { border-bottom: 2px solid #fff; }
    </style>


</head>

  <body>
    <p>Skriv teksten (<b>·</b> er mellemrum, <b>↵</b> er enter):</p>
      <div id="target"></div>
      <button id="new">Ny tekst</button>
      <button id="save">Gem log</button>


    <script>
        const GROUPS = 25;
        const MIN_LEN = 2;
        const MAX_LEN = 12;
        const DIGIT_CHANCE = 0.15;
        const ENTER_CHANCE = 0.2;

        const LETTERS = "abcdefghijklmnopqrstuvwxyzæøå";
        const DIGITS = "0123456789";

        let log = [];
        let target = "";
        let typed = "";
        const targetEl = document.getElementById("target");

        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function randChar() {
            const pool = Math.random() < DIGIT_CHANCE ? DIGITS : LETTERS;
            return pool[randInt(0, pool.length - 1)];
        }

        function generateText() {
            let text = "";
            for (let g = 0; g < GROUPS; g++) {
                const len = randInt(MIN_LEN, MAX_LEN);
                for (let i = 0; i < len; i++) text += randChar();
                if (g < GROUPS - 1) {
                    text += Math.random() < ENTER_CHANCE ? "\n" : " ";
                }
            }
            return text;
        }

        function render() {
            let html = "";
            for (let i = 0; i < target.length; i++) {
                const c = target[i];
                const shown = c === " " ? "·" : c === "\n" ? "↵\n" : c;
                let cls = "";
                if (i < typed.length) cls = typed[i] === c ? "ok" : "bad";
                else if (i === typed.length) cls = "cur";
                html += '<span class="' + cls + '">' + shown + "</span>";
                if (c === " ") html += "<wbr>"; 
            }
            targetEl.innerHTML = html;
        }

        function newText() {
            target = generateText();
            typed = "";
            log = [];
            render();
        }

        // timestamp
        function rec(type, e) {
            if (e.repeat) return;
            const t = Date.now();
            const d = new Date(t);
            const realtime = d.toLocaleTimeString("da-DK") + "." + String(d.getMilliseconds()).padStart(3, "0");
            log.push({ t: t, realtime: realtime, type: type, key: e.key, code: e.code });
        }

        document.addEventListener("keydown", (e) => {
            rec("down", e);
            if (e.ctrlKey || e.metaKey || e.altKey) return;

            if (e.key === "Backspace") {
                typed = typed.slice(0, -1);
                e.preventDefault();
            } else if (e.key === "Enter") {
                if (typed.length < target.length) typed += "\n";
                e.preventDefault();
            } else if (e.key.length === 1) {
                if (typed.length < target.length) typed += e.key;
                e.preventDefault(); 
            }
            render();
        });
        document.addEventListener("keyup", (e) => rec("up", e));

        document.getElementById("new").addEventListener("click", (e) => {
            e.currentTarget.blur();
            newText();
        });

        document.getElementById("save").addEventListener("click", (e) => {
            e.currentTarget.blur();
            // Binary Large Object
            const out = { target: target, typed: typed, log: log };
            const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "keystroke_log_" + Date.now() + ".json";
            a.click();
            URL.revokeObjectURL(a.href);
        });

        newText();

    </script>
  </body>
</html>
