# Config til meltransformer

sample_rate: 48000   # Hz - skal matche optagelsens sample rate
target: 9600         # længden af en lydbid i samples (0,2 sek. ved 44100 Hz)
n_fft: 1024          # FFT-vinduets størrelse (samples)
hop_length: 256      # skridt mellem FFT-vinduer (samples)
n_mels: 64           # antal mel-bånd = højden på spektrogrammet

pre_ms: 10           # hvor mange ms FØR hver onset udklippet skal starte